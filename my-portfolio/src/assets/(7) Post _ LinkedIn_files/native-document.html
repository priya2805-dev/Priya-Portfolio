            <li class="carousel-slide" data-ssplayer-slide-index="0" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/1/1757849504533?e=1763596800&amp;v=beta&amp;t=vejLOMDeZ-ND7fUpkywyoD6qNLm6UfBMyMNcN93OL-I" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 100+ Important React.js Interview questions Author: Sandeep Pal React.js Interview Questions Basics &amp; Core Concepts 1. What is React and why would you use it? React is a JavaScript library for building user interfaces, mainly for single-page applications. It helps developers create reusable UI components, manage state efficiently, and update the UI in a performant way. ✅ Why use React? ●​ Easy to break UIs into components​ ●​ Efficient updates with Virtual DOM​ ●​ Rich ecosystem (React Router, Redux, etc.)​ ●​ Backed by Facebook and a large community​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal https://www.linkedin.com/in/sandeeppal" src="./1757849504140"></li><li class="carousel-slide" data-ssplayer-slide-index="1" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/2/1757849504533?e=1763596800&amp;v=beta&amp;t=HTKLPnDzAiHzO1RqKiUJAcKIGsz-_h97afOroS9F6hg" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 2. What are the main features of React? ●​ JSX – JavaScript + XML​ ●​ Components – Reusable and composable​ ●​ Virtual DOM – Efficient DOM updates​ ●​ Unidirectional data flow – One-way data binding​ ●​ Lifecycle methods (in class components)​ ●​ Hooks (in functional components)​ 3. What is JSX? Can browsers read JSX directly? JSX stands for JavaScript XML. It lets you write HTML-like syntax in JavaScript. const element = &lt;h1&gt;Hello, world!&lt;/h1&gt;; 🚫 No, browsers cannot read JSX directly. JSX needs to be transpiled (e.g., using Babel) into regular JavaScript. 4. How does React differ from other JavaScript frameworks? Feature React Angular Vue Type Library (UI focused) Framework (full-featured) Framework (lightweight) DOM Handling Virtual DOM Real DOM Virtual DOM Data Binding One-way Two-way Both supported Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(1)"></li><li class="carousel-slide" data-ssplayer-slide-index="2" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/3/1757849504533?e=1763596800&amp;v=beta&amp;t=zQ91Wuoh693tugG4O-5xPsC815gJm6CuOqdbw5IfopY" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Learning Curve Medium Steep Easy 5. What are components in React? Components are the building blocks of a React application. Each component is an isolated, reusable piece of the UI. ✅ Example: function Welcome(props) { return &lt;h1&gt;Hello, {props.name}&lt;/h1&gt;; } 6. Explain the difference between Class and Functional components. Feature Class Component Functional Component Syntax ES6 Class Function State this.state useState hook Lifecycle methods Yes Use useEffect, etc. Code size More verbose Cleaner and shorter ✅ Example: Class: class Welcome extends React.Component { render() { return &lt;h1&gt;Hello, {this.props.name}&lt;/h1&gt;; } } Functional: Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(2)"></li><li class="carousel-slide" data-ssplayer-slide-index="3" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/4/1757849504533?e=1763596800&amp;v=beta&amp;t=F3jDP78EW05T22sQN-1asz0DzFg9naXmuw9JyGqWdXc" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al function Welcome(props) { return &lt;h1&gt;Hello, {props.name}&lt;/h1&gt;; } 7. What is the Virtual DOM and how does React use it? The Virtual DOM is a lightweight in-memory representation of the real DOM. React updates the Virtual DOM first and compares it with the previous version, only applying the necessary changes to the real DOM. ✅ Benefit: Improves performance by reducing real DOM operations. 8. How does React’s reconciliation algorithm work? React’s reconciliation algorithm compares the new Virtual DOM with the old one using a diffing algorithm. It: ●​ Identifies what changed (nodes, attributes, etc.)​ ●​ Applies minimum changes to the actual DOM​ ●​ Uses keys to track list item changes efficiently​ 9. What are props in React? Props (short for &quot;properties&quot;) are read-only data passed from a parent component to a child. ✅ Example: function Greeting(props) { return &lt;h1&gt;Hello, {props.name}!&lt;/h1&gt;; } &lt;Greeting name=&quot;Alice&quot; /&gt; Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(3)"></li><li class="carousel-slide" data-ssplayer-slide-index="4" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/5/1757849504533?e=1763596800&amp;v=beta&amp;t=JrM-uqnqVGQA-NTHRhOW5HnNT0Pg-WvSZ6oIuLuApuw" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 10. What is state in React? State is data that is local to a component and can change over time. ✅ Example using useState: import { useState } from &#39;react&#39;; function Counter() { const [count, setCount] = useState(0); return &lt;button onClick={() =&gt; setCount(count + 1)}&gt;{count}&lt;/button&gt;; } 11. How do you update state in React? ●​ Functional component: Use setState from useState.​ ●​ Class component: Use this.setState().​ ✅ Example: const [name, setName] = useState(&quot;John&quot;); setName(&quot;Doe&quot;); 12. What is the difference between state and props? Feature Props State Mutable? ❌ No (read-only) ✅ Yes Who sets it? Parent component Component itself Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(4)"></li><li class="carousel-slide" data-ssplayer-slide-index="5" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/6/1757849504533?e=1763596800&amp;v=beta&amp;t=Q-IQOwWm5kU3rOkTo3abmOGAE3gg3fv2H9715_XyLcM" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Used for Passing data Handling internal data 13. What is the purpose of keys in React lists? Keys help React identify which items have changed, been added, or removed. ✅ Example: {items.map(item =&gt; ( &lt;li key={item.id}&gt;{item.name}&lt;/li&gt; ))} 🛑 Avoid using array index as key unless absolutely necessary. 14. How do you conditionally render elements in React? ✅ Using ternary: {isLoggedIn ? &lt;Logout /&gt; : &lt;Login /&gt;} ✅ Using short-circuit: {isVisible &amp;&amp; &lt;Sidebar /&gt;} 15. What are fragments in React and why are they useful? Fragments let you return multiple elements without adding an extra DOM node. ✅ Example: &lt;&gt; &lt;h1&gt;Title&lt;/h1&gt; &lt;p&gt;Description&lt;/p&gt; &lt;/&gt; Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(5)"></li><li class="carousel-slide" data-ssplayer-slide-index="6" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data- &quot;&gt;Submit&lt;/button&gt; &lt;/form&gt; ); } 20. What is lifting state up in React? Lifting state up means moving state to the nearest common ancestor when multiple components need to share or modify it. ✅ Example: function Parent() { const [value, setValue] = useState(&quot;&quot;); return ( Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(7)"></li><li class="carousel-slide" data-ssplayer-slide-index="8" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/9/1757849504533?e=1763596800&amp;v=beta&amp;t=mMzffGXZVyYA7hOI57eSpNBuLF0qlzxTTH_fs9j2ZYo" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al &lt;&gt; &lt;Input value={value} onChange={setValue} /&gt; &lt;Display value={value} /&gt; &lt;/&gt; ); } function Input({ value, onChange }) { return &lt;input value={value} onChange={e =&gt; onChange(e.target.value)} /&gt;; } function Display({ value }) { return &lt;p&gt;{value}&lt;/p&gt;; } React Hooks 21. What are React Hooks? Hooks are functions that let you &quot;hook into&quot; React state and lifecycle features in functional components. Before hooks, only class components could use state and lifecycle methods. ✅ Hooks introduced in React 16.8. 22. Explain the useState hook with an example. useState lets you add state to functional components. Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(8)"></li><li class="carousel-slide" data-ssplayer-slide-index="9" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/10/1757849504533?e=1763596800&amp;v=beta&amp;t=GXMfbuxHrdMZ_p19w6CHw71i68SU-DtW9wn-_ e="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/15/1757849504533?e=1763596800&amp;v=beta&amp;t=kIApncELEaZBWyZxBeJmhatSFExVusOBRRaIYBJPZ48" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ✅ Use case:​ Avoid recalculating heavy logic on every render. const filteredList = useMemo(() =&gt; { return items.filter(item =&gt; item.includes(searchTerm)); }, [items, searchTerm]); 31. What is useCallback and when should it be used? useCallback memoizes a function to avoid unnecessary re-creations. ✅ Syntax: const memoizedCallback = useCallback(() =&gt; { doSomething(a, b); }, [a, b]); ✅ Use case: ●​ Prevents unnecessary re-renders of child components receiving functions as props.​ const handleClick = useCallback(() =&gt; { console.log(&quot;Clicked!&quot;); }, []); 32. How do hooks help avoid common pitfalls of class components? Class Component Pitfall Hook-Based Solution this binding issues ✅ No this in hooks Boilerplate code ✅ More concise with hooks Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(14)"></li><li class="carousel-slide" data-ssplayer-slide-index="15" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/16/1757849504533?e=1763596800&amp;v=beta&amp;t=fr92uBvfszONWibRvCO3xs24QJmw3DyGf_1RL0Bp75U" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Sharing logic ✅ Custom hooks enable reuse Complex lifecycle logic ✅ useEffect unifies side effects ✅ Hooks lead to simpler, more readable, and reusable code. React State Management – Redux, Context API, and More 33. What is Redux and why might you use it with React? Redux is a predictable state container for JavaScript apps, often used with React. ✅ Why use Redux? ●​ Centralizes app state​ ●​ Makes state predictable and traceable​ ●​ Useful in large-scale apps with deeply nested components​ ●​ Works well with middleware for async tasks (like API calls)​ 34. What are the core principles of Redux? Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(15)"></li><li class="carousel-slide" data-ssplayer-slide-index="16" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/17/1757849504533?e=1763596800&amp;v=beta&amp;t=JO-HrVGayTGCJO5St8nMtb3PwGl5FsPzRIL7WMTpSOE" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 1.​ Single source of truth: All state is stored in a single JavaScript object (store).​ 2.​ State is read-only: You can&#39;t modify state directly — only via actions.​ 3.​ Changes via pure functions: Reducers are pure functions that take state and action, and return new state.​ 35. How do actions, reducers, and store work together in Redux? 🔁 Data Flow in Redux: 1.​ Action: A plain JS object that describes what happened.​ { type: &#39;INCREMENT&#39; } 2.​ Reducer: A pure function that returns the next state.​ function counterReducer(state = 0, action) { switch (action.type) { case &#39;INCREMENT&#39;: return state + 1; default: return state; } } 3.​ Store: Holds the state and dispatches actions.​ import { createStore } from &#39;redux&#39;; const store = createStore(counterReducer); Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(16)"></li><li class="carousel-slide" data-ssplayer-slide-index="17" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms ​ redux-thunk​ ●​ redux-saga​ ●​ redux-logger​ ✅ Example (redux-logger): const logger = store =&gt; next =&gt; action =&gt; { console.log(&#39;dispatching&#39;, action); return next(action); }; 40. What are thunks and sagas? Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(18)"></li><li class="carousel-slide" data-ssplayer-slide-index="19" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/20/1757849504533?e=1763596800&amp;v=beta&amp;t=ZLQCIyA7sIDoiOaaO10gdQPQxiAxWVxkDZp_0abcV64" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Feature Thunks (redux-thunk) Sagas (redux-saga) Concept Functions returned from actions Generator-based side effects Complexity Simple Advanced Syntax Imperative (JS functions) Declarative (generators/yield) Use case Basic async logic Complex flows, retries, delays ✅ Thunk example: const fetchUser = () =&gt; (dispatch) =&gt; { fetch(&quot;/api/user&quot;) .then(res =&gt; res.json()) .then(data =&gt; dispatch({ type: &quot;SET_USER&quot;, payload: data })); }; 41. How does Redux Toolkit simplify Redux usage? Redux Toolkit (RTK) is the official, recommended way to write Redux logic. ✅ RTK Benefits: ●​ Less boilerplate​ ●​ Built-in createSlice, createAsyncThunk, configureStore​ ●​ Integrated DevTools​ ●​ Handles immutability under the hood​ ✅ Example: const counterSlice = createSlice({ name: &#39;counter&#39;, initialState: 0, reducers: { Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(19)"></li><li class="carousel-slide" data-ssplayer-slide-index="20" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/21/1757849504533?e=1763596800&amp;v=beta&amp;t=W1fi9FdwVJ6oNm5Ntxy1MTCyHNcNrYccdSORPB_gKVQ" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al increment: (state) =&gt; state + 1, }, }); export const { increment } = counterSlice.actions; 42. How would you decide between Redux and Context API? Scenario Use Simple data (theme, locale) ✅ Context API Complex global state ✅ Redux Needs middleware or DevTools ✅ Redux Only few components need data ✅ Context Large team/multiple features ✅ Redux Toolkit 🎯 Rule of thumb: Use Context for simple static data, and Redux for dynamic or large-scale app state. 43. How do you handle side effects in Redux? ✅ Using middleware, such as: ●​ redux-thunk – lets you dispatch functions​ ●​ redux-saga – handles complex side effects via generators​ ●​ redux-observable – uses RxJS​ ✅ Example with thunk: Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(20)"></li><li class="carousel-slide" data-ssplayer-slide-index="21" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/22/1757849504533?e=1763596800&amp;v=beta&amp;t=n60SvDHEpKabnefTaV701zRD3Khq9X3PffwSBbmjviA" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al const fetchData = () =&gt; async (dispatch) =&gt; { const response = await fetch(&#39;/data&#39;); const data = await response.json(); dispatch({ type: &#39;SET_DATA&#39;, payload: data }); }; 44. What are selectors in Redux? Selectors are functions that read and return data from the store, often with memoization. ✅ Purpose: ●​ Centralize access to state shape​ ●​ Avoid duplication​ ●​ Optimize performance​ ✅ Basic selector: const selectUser = (state) =&gt; state.user; ✅ With reselect: import { createSelector } from &#39;reselect&#39;; const selectCartItems = (state) =&gt; state.cart.items; const selectTotalPrice = createSelector( [selectCartItems], (items) =&gt; items.reduce((sum, item) =&gt; sum + item.price, 0) ); React Routing Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(21)"></li><li class="carousel-slide" data-ssplayer-slide-index="22" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/23/1757849504533?e=1763596800&amp;v=beta&amp;t=ZfMjexqW7uoNrE41SdHq97qMs6TvcM7hUqvUry0vLgU" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 45. What is React Router? React Router is the standard library for routing in React applications. It enables navigation between different components or views without full page reloads, helping build single-page applications (SPA). ●​ Declarative routing: Allows you to define routes using JSX.​ ●​ Dynamic routing: Routes can be dynamically rendered based on the state, props, or URL.​ 46. How do you implement routing in React? You can implement routing in React using React Router. Here&#39;s how: 1.​ Install the necessary package:​ npm install react-router-dom 2.​ Wrap your app with BrowserRouter (or HashRouter):​ import { BrowserRouter as Router, Route, Switch } from &#39;react-router-dom&#39;; function App() { return ( &lt;Router&gt; &lt;Switch&gt; &lt;Route exact path=&quot;/&quot; component={Home} /&gt; &lt;Route path=&quot;/about&quot; component={About} /&gt; &lt;/Switch&gt; &lt;/Router&gt; Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(22)"></li><li class="carousel-slide" data-ssplayer-slide-index="23" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/24/1757849504533?e=1763596800&amp;v=beta&amp;t=hP6ehnW-8K-eIMWNasvGHvxc8I9gqqh9HrE1EV1sDIk" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ); } 3.​ Define routes using the &lt;Route /&gt; component:​ function Home() { return &lt;h1&gt;Home Page&lt;/h1&gt;; } function About() { return &lt;h1&gt;About Page&lt;/h1&gt;; } 47. What is the difference between BrowserRouter and HashRouter? Feature BrowserRouter HashRouter URL structure Clean URLs (e.g., /home, /about) URLs include a # (e.g., /home#about) Usage Preferred for modern apps on a web server Useful for apps without server-side routing (e.g., static sites) History API support Uses the HTML5 history API Uses the URL&#39;s hash to manage routing SEO friendliness SEO-friendly (with server-side configuration) Less SEO-friendly due to # in the URL 48. How do you create nested routes? To create nested routes, place a &lt;Route /&gt; inside another route&#39;s component. Example: Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(23)"></li><li class="carousel-slide" data-ssplayer-slide-index="24" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/25/1757849504533?e=1763596800&amp;v=beta&amp;t=Zq866N5mIC3s7JA2SzBbIWjeK3X7VjfHKW3eJI5JGVM" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al import { BrowserRouter as Router, Route, Switch, Link } from &#39;react-router-dom&#39;; function App() { return ( &lt;Router&gt; &lt;div&gt; &lt;nav&gt; &lt;Link to=&quot;/about/team&quot;&gt;Team&lt;/Link&gt; &lt;Link to=&quot;/about/company&quot;&gt;Company&lt;/Link&gt; &lt;/nav&gt; &lt;Switch&gt; &lt;Route exact path=&quot;/about&quot; component={About} /&gt; &lt;Route path=&quot;/about/team&quot; component={Team} /&gt; &lt;Route path=&quot;/about/company&quot; component={Company} /&gt; &lt;/Switch&gt; &lt;/div&gt; &lt;/Router&gt; ); } function About() { return &lt;h2&gt;About Page&lt;/h2&gt;; } function Team() { return &lt;h3&gt;Team Page&lt;/h3&gt;; } function Company() { return &lt;h3&gt;Company Page&lt;/h3&gt;; } 49. How do you pass parameters in routes? Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(24)"></li><li class="carousel-slide" data-ssplayer-slide-index="25" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/26/1757849504533?e=1763596800&amp;v=beta&amp;t=AarxbErpxtNNtuXvAWJO1hIPRI-adq-_eSgC6CharmA" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al You can pass URL parameters (also called dynamic routes) using : in the route path. Example: import { BrowserRouter as Router, Route, Switch, useParams } from &#39;react-router-dom&#39;; function App() { return ( &lt;Router&gt; &lt;Switch&gt; &lt;Route path=&quot;/user/:id&quot; component={User} /&gt; &lt;/Switch&gt; &lt;/Router&gt; ); } function User() { const { id } = useParams(); // Access the dynamic parameter return &lt;h1&gt;User ID: {id}&lt;/h1&gt;; } In the example above, visiting /user/1 will display User ID: 1. 50. What is the difference between Link and NavLink? Feature Link NavLink Purpose Navigate between pages Navigation with active styling Active style No built-in active style Automatically adds an active class when the route is active Use case Basic navigation For creating navigation menus with active links (e.g., highlighting the active link) Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(25)"></li><li class="carousel-slide" data-ssplayer-slide-index="26" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/27/1757849504533?e=1763596800&amp;v=beta&amp;t=QhDWl6yZZdVVpipfM4jfOyP-AQoDyOTjS2Lp69SRTUI" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Example of NavLink: import { NavLink } from &#39;react-router-dom&#39;; function Navbar() { return ( &lt;nav&gt; &lt;NavLink to=&quot;/&quot; activeClassName=&quot;active&quot;&gt;Home&lt;/NavLink&gt; &lt;NavLink to=&quot;/about&quot; activeClassName=&quot;active&quot;&gt;About&lt;/NavLink&gt; &lt;/nav&gt; ); } 51. How do you implement protected routes? Protected routes are used to restrict access to certain routes based on some condition (e.g., user authentication). You can create a wrapper component that checks the condition and either redirects or renders the requested route. Example: import { Redirect, Route } from &#39;react-router-dom&#39;; function ProtectedRoute({ component: Component, ...rest }) { const isAuthenticated = false; // Replace with your auth logic return ( &lt;Route {...rest} render={(props) =&gt; isAuthenticated ? ( &lt;Component {...props} /&gt; ) : ( &lt;Redirect to=&quot;/login&quot; /&gt; ) } /&gt; Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(26)"></li><li class="carousel-slide" data-ssplayer-slide-index="27" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/28/1757849504533?e=1763596800&amp;v=beta&amp;t=kwmCSXHcGoWGPEPA5DN-lmT68wChnJxTWHZ2ETNe5QY" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ); } function App() { return ( &lt;Router&gt; &lt;Switch&gt; &lt;Route path=&quot;/login&quot; component={Login} /&gt; &lt;ProtectedRoute path=&quot;/dashboard&quot; component={Dashboard} /&gt; &lt;/Switch&gt; &lt;/Router&gt; ); } In this example, if the user is not authenticated, they will be redirected to the login page when trying to access the /dashboard route. 52. How do you programmatically navigate in React Router? You can navigate programmatically using the useHistory hook (React Router v5) or useNavigate hook (React Router v6). For React Router v5 (useHistory): import { useHistory } from &#39;react-router-dom&#39;; function MyComponent() { const history = useHistory(); const goToHome = () =&gt; { history.push(&#39;/&#39;); }; return &lt;button onClick={goToHome}&gt;Go to Home&lt;/button&gt;; } Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(27)"></li><li class="carousel-slide" data-ssplayer-slide-index="28" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/29/1757849504533?e=1763596800&amp;v=beta&amp;t=LILhelPyj3_CIU6eFgtkOyxRUWpnE_05sVOk8x2018I" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al For React Router v6 (useNavigate): import { useNavigate } from &#39;react-router-dom&#39;; function MyComponent() { const navigate = useNavigate(); const goToHome = () =&gt; { navigate(&#39;/&#39;); }; return &lt;button onClick={goToHome}&gt;Go to Home&lt;/button&gt;; } React Performance Optimization 53. What are common causes of performance issues in React apps? Common causes of performance issues include: 1.​ Unnecessary Re-renders: React components re-render every time their state or props change. If not properly optimized, this can lead to performance bottlenecks.​ ○​ Example: A large component tree where every small state change causes re-renders for the entire tree.​ 2.​ Large Component Trees: A deeply nested component structure can increase the time it takes for React to render.​ 3.​ Heavy Computations in Render: If you&#39;re performing heavy calculations directly in the render method, it can block the UI thread, resulting in slow rendering.​ 4.​ Inefficient List Rendering: Rendering large lists or complex components without optimization can degrade performance, especially if each item is re-rendered every time the parent changes.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(28)"></li><li class="carousel-slide" data-ssplayer-slide-index="29" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/30/1757849504533?e=1763596800&amp;v=beta&amp;t=gajBoKz5wJSE32jFSKZT52aXv8guOtQ4AoQaj6a1p5Q" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 5.​ Excessive Reconciliation: React&#39;s reconciliation algorithm can become slow if the state changes frequently or if the shouldComponentUpdate method isn’t properly utilized.​ 6.​ Event Handlers and Inline Functions: Using inline functions inside render() or JSX can create new function references on every render, causing unnecessary re-renders.​ 54. How does React.memo improve performance? React.memo is a higher-order component that memoizes functional components. It only re-renders the component if its props have changed. ●​ Before: Every re-render, even if props haven’t changed.​ ●​ After: Prevents unnecessary re-renders when props remain the same.​ const MyComponent = React.memo(function MyComponent({ name }) { return &lt;div&gt;{name}&lt;/div&gt;; }); // MyComponent will only re-render if the `name` prop changes 55. How do useMemo and useCallback help with performance? useMemo: useMemo is a hook that memoizes the result of an expensive function call and only recomputes the value when one of the dependencies changes. ●​ Use case: Expensive calculations or operations that don’t need to be recalculated on every render.​ Example: Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(29)"></li><li class="carousel-slide" data-ssplayer-slide-index="30" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/31/1757849504533?e=1763596800&amp;v=beta&amp;t=Ty3xcPbOCH_mHYFzF9_rBf5heqcD9LbHXMriYQ2LHMQ" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al const expensiveValue = useMemo(() =&gt; computeExpensiveValue(a, b), [a, b]); // expensiveValue will only recompute when `a` or `b` changes useCallback: useCallback is used to memoize a function so it doesn’t get recreated on every render. ●​ Use case: Prevents function re-creation when passing functions down to child components (important when using React.memo or PureComponent).​ Example: const handleClick = useCallback(() =&gt; { // handle the click event }, [dependencies]); // Recreate the function only when dependencies change 56. What is code splitting and how do you implement it? Code splitting is the practice of breaking up the bundle into smaller chunks so that only the required code is loaded when needed, improving initial load performance. How to Implement: 1.​ Use React.lazy to dynamically import components.​ 2.​ Use Suspense to handle the loading state while the component is loading.​ import React, { Suspense } from &#39;react&#39;; const LazyComponent = React.lazy(() =&gt; import(&#39;./LazyComponent&#39;)); function App() { return ( &lt;Suspense fallback={&lt;div&gt;Loading...&lt;/div&gt;}&gt; Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(30)"></li><li class="carousel-slide" data-ssplayer-slide-index="31" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/32/1757849504533?e=1763596800&amp;v=beta&amp;t=vEerFOQ9rJlVKZNVPYJwIbJ115IrCTZMHdi0pzEbG3E" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al &lt;LazyComponent /&gt; &lt;/Suspense&gt; ); } ●​ React.lazy enables dynamic imports for code splitting.​ ●​ Suspense lets you specify a loading state while waiting for the component to load.​ 57. What is lazy loading in React? Lazy loading is a design pattern where resources (like components) are loaded only when they are needed (e.g., when they enter the viewport or the user navigates to the route). In React, lazy loading is typically implemented using React.lazy and Suspense. Example: import { Suspense } from &#39;react&#39;; const HeavyComponent = React.lazy(() =&gt; import(&#39;./HeavyComponent&#39;)); function App() { return ( &lt;Suspense fallback={&lt;div&gt;Loading...&lt;/div&gt;}&gt; &lt;HeavyComponent /&gt; &lt;/Suspense&gt; ); } This ensures that the heavy component is only loaded when the app actually needs it. 58. How does React’s shouldComponentUpdate method work? Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(31)"></li><li class="carousel-slide" data-ssplayer-slide-index="32" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/33/1757849504533?e=1763596800&amp;v=beta&amp;t=ox2vA3b6tcgBIkSDK9RnQNu8SXR0Jx7d6SuOqSXGPlg" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al shouldComponentUpdate is a lifecycle method in class components that determines whether a component should re-render. By default, a component re-renders when state or props change, but shouldComponentUpdate allows you to optimize this behavior. ●​ Return false to prevent a re-render.​ ●​ Return true (or omit the method) to allow a re-render.​ Example: class MyComponent extends React.Component { shouldComponentUpdate(nextProps, nextState) { // Prevent re-render if props haven&#39;t changed return nextProps.name !== this.props.name; } render() { return &lt;div&gt;{this.props.name}&lt;/div&gt;; } } 59. How can you optimize rendering lists in React? Rendering large lists can cause performance issues if each item re-renders unnecessarily. Here are some strategies: 1.​ Use React.memo for list items that do not change often.​ 2.​ Key Prop: Always provide a unique key to each list item to help React efficiently update only the items that have changed.​ 3.​ Virtualization: Use libraries like react-window or react-virtualized to only render the items that are visible in the viewport.​ Example of list optimization with key: Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(32)"></li><li class="carousel-slide" data-ssplayer-slide-index="33" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/34/1757849504533?e=1763596800&amp;v=beta&amp;t=kTYTpE6tVDjNRu5lAYszAqG3MEMKz9SnvvYhBk90Axo" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al const List = ({ items }) =&gt; { return ( &lt;ul&gt; {items.map(item =&gt; ( &lt;li key={item.id}&gt;{item.name}&lt;/li&gt; ))} &lt;/ul&gt; ); }; 60. What are pure components? A Pure Component is a React class component that automatically implements shouldComponentUpdate with a shallow prop and state comparison. ●​ Benefit: It prevents unnecessary re-renders by performing a shallow comparison of props and state.​ Example: class MyComponent extends React.PureComponent { render() { return &lt;div&gt;{this.props.name}&lt;/div&gt;; } } Pure components are a good choice when you know that your component only depends on props and state and you want to avoid unnecessary updates. 61. How does virtualization work in React lists? Virtualization is a technique where only the items that are visible in the viewport are rendered, while the others are not rendered until they come into view. This significantly reduces the number of DOM nodes and boosts performance when rendering large lists. Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(33)"></li><li class="carousel-slide" data-ssplayer-slide-index="34" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/35/1757849504533?e=1763596800&amp;v=beta&amp;t=7t8QRpQv2eV4k2F_8L75L65QoB2jNUzU_0ZKODfvSkw" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Popular libraries for virtualization in React include: ●​ react-window​ ●​ react-virtualized​ Example with react-window: import { FixedSizeList as List } from &#39;react-window&#39;; function MyList({ items }) { return ( &lt;List height={400} itemCount={items.length} itemSize={35} width={300} &gt; {({ index, style }) =&gt; ( &lt;div style={style}&gt;{items[index]}&lt;/div&gt; )} &lt;/List&gt; ); } Only the visible items will be rendered, and as the user scrolls, new items will be loaded dynamically. 62. How do you debug performance issues in React apps? Debugging performance issues can be done using several tools and strategies: 1.​ React Developer Tools:​ ○​ Use the Profiler tab to measure the render times and identify slow components.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(34)"></li><li class="carousel-slide carousel-slide-active" data-ssplayer-slide-index="35" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/36/1757849504533?e=1763596800&amp;v=beta&amp;t=UZkSkFl3L3ZRTxmu2Du_uRq7XQnKaJ0uIPVWJ9M9P2s" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ○​ Check for unnecessary re-renders and optimize with React.memo or shouldComponentUpdate.​ 2.​ Console Logs and performance.now():​ ○​ Log the time it takes for certain parts of your app to render and pinpoint slow areas.​ 3.​ React&#39;s useEffect Dependency Analysis:​ ○​ If using hooks, make sure you are providing the correct dependencies to useEffect and useMemo, and avoid unnecessary recalculations.​ 4.​ Third-party libraries:​ ○​ Use performance monitoring tools like why-did-you-render to detect unnecessary re-renders in functional components.​ Example: npm install @welldone-software/why-did-you-render Testing React Components 63. How do you test React components? You test React components by writing unit tests that simulate rendering, interaction, and lifecycle behavior. Key Steps: 1.​ Choose a Testing Library: Use libraries like Jest (test runner) and React Testing Library (for testing React components).​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(35)"></li><li class="carousel-slide" data-ssplayer-slide-index="36" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/37/1757849504533?e=1763596800&amp;v=beta&amp;t=xNFYrkLk3pIuGFrh9Vjai5sdA0uPZY52nplsjNk7cUA" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 2.​ Write Tests: Use functions like render() to simulate component rendering, and fireEvent() to simulate user interaction.​ 3.​ Assertions: Use expect() to assert the expected behavior.​ Example: import { render, screen, fireEvent } from &#39;@testing-library/react&#39;; import MyComponent from &#39;./MyComponent&#39;; test(&#39;renders the component and interacts&#39;, () =&gt; { render(&lt;MyComponent /&gt;); const button = screen.getByText(&#39;Click me&#39;); fireEvent.click(button); expect(screen.getByText(&#39;Clicked!&#39;)).toBeInTheDocument(); }); 64. What is Jest and how is it used with React? Jest is a JavaScript testing framework created by Facebook, commonly used for testing React applications. It comes with: ●​ Test runner: Executes test files.​ ●​ Assertions: Provides functions like expect() for asserting conditions.​ ●​ Mocks: Mocking capabilities for API calls or functions.​ ●​ Snapshots: Captures UI output at a given time.​ How to use Jest with React: Install Jest:​ ​ npm install --save-dev jest 1.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(36)"></li><li class="carousel-slide" data-ssplayer-slide-index="37" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/38/1757849504533?e=1763596800&amp;v=beta&amp;t=zRXgtMA3P6qCCGKtqjTK0sJ6s6iavZpp5-htax8vwvU" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 2.​ Create tests: Write tests in files with .test.js or .spec.js extensions.​ 3.​ Run tests: Jest automatically finds test files and executes them using npm test or jest command.​ 65. What is React Testing Library and how does it differ from Enzyme? React Testing Library (RTL) and Enzyme are two popular testing utilities for React. Feature React Testing Library Enzyme Philosophy Tests behavior from the user&#39;s perspective Tests component internals and implementation Test Focus Interaction, rendering, and accessibility Shallow rendering, component state, and props Testing Approach Encourages testing DOM behavior and accessibility Encourages testing component internals and methods Integration with React Built with React’s rendering behavior in mind Requires enzyme adapter for different React versions Recommendation More modern, encourages better testing practices Still used, but React Testing Library is more popular Key difference: ●​ React Testing Library focuses on testing the output of your components (UI behavior), similar to how a user interacts with the app.​ ●​ Enzyme focuses more on testing the internal implementation (component state, methods).​ 66. How do you write a unit test for a React component? Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(37)"></li><li class="carousel-slide" data-ssplayer-slide-index="38" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/39/1757849504533?e=1763596800&amp;v=beta&amp;t=8b_yYso8Pu6BMwFh1CQSJfQLqJdNi8ThjBkFjGJODO0" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al A unit test checks a small unit of functionality, such as a React component. Here’s how you can write a unit test: 1.​ Render the component: Use render() from React Testing Library.​ 2.​ Simulate interactions: Use fireEvent() or user-event for simulating actions like clicks, typing, etc.​ 3.​ Assert behavior: Use expect() to check the outcome, like whether an element is rendered or a function is called.​ Example of a simple unit test: import { render, screen, fireEvent } from &#39;@testing-library/react&#39;; import Counter from &#39;./Counter&#39;; test(&#39;increments counter on button click&#39;, () =&gt; { render(&lt;Counter /&gt;); const button = screen.getByText(&#39;Increment&#39;); fireEvent.click(button); expect(screen.getByText(&#39;1&#39;)).toBeInTheDocument(); }); In this test, you: 1.​ Render the Counter component.​ 2.​ Simulate a click on the &quot;Increment&quot; button.​ 3.​ Assert that the number 1 is now displayed.​ 67. How do you test component interactions and events? Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(38)"></li><li class="carousel-slide" data-ssplayer-slide-index="39" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/40/1757849504533?e=1763596800&amp;v=beta&amp;t=v3zXZoejCZUxBC50d1pbxjJCbDEUSKDudC-YaWVKQoA" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al To test component interactions like button clicks, form submissions, or other events, you can use fireEvent or user-event (for more realistic user interactions). Example using fireEvent: import { render, screen, fireEvent } from &#39;@testing-library/react&#39;; import MyComponent from &#39;./MyComponent&#39;; test(&#39;button click changes text&#39;, () =&gt; { render(&lt;MyComponent /&gt;); const button = screen.getByText(&#39;Click me&#39;); fireEvent.click(button); expect(screen.getByText(&#39;You clicked!&#39;)).toBeInTheDocument(); }); Example using user-event (better for simulating real user interactions): npm install --save-dev @testing-library/user-event import { render, screen } from &#39;@testing-library/react&#39;; import userEvent from &#39;@testing-library/user-event&#39;; import MyComponent from &#39;./MyComponent&#39;; test(&#39;button click changes text&#39;, () =&gt; { render(&lt;MyComponent /&gt;); const button = screen.getByText(&#39;Click me&#39;); userEvent.click(button); expect(screen.getByText(&#39;You clicked!&#39;)).toBeInTheDocument(); }); user-event is better because it simulates real user actions like clicks, typing, and more. 68. How do you mock API calls in tests? To mock API calls in tests, you can use jest.mock() to mock functions or API calls. Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(39)"></li><li class="carousel-slide" data-ssplayer-slide-index="40" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/41/1757849504533?e=1763596800&amp;v=beta&amp;t=awCmMcL7YRxFUUghMFCJdLNgXHlmGwE6Hpe_gWQSnEI" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Mocking fetch or axios: Mock fetch:​ ​ global.fetch = jest.fn(() =&gt; Promise.resolve({ json: () =&gt; Promise.resolve({ data: &#39;mock data&#39; }), }) ); 1.​ Mock axios:​ ​ import axios from &#39;axios&#39;; jest.mock(&#39;axios&#39;); axios.get.mockResolvedValue({ data: &#39;mock data&#39; }); 2.​ Example of mocking fetch in a test: import { render, screen, waitFor } from &#39;@testing-library/react&#39;; import MyComponent from &#39;./MyComponent&#39;; test(&#39;fetches and displays data&#39;, async () =&gt; { global.fetch = jest.fn(() =&gt; Promise.resolve({ json: () =&gt; Promise.resolve({ message: &#39;Data loaded&#39; }), }) ); render(&lt;MyComponent /&gt;); await waitFor(() =&gt; screen.getByText(&#39;Data loaded&#39;)); expect(screen.getByText(&#39;Data loaded&#39;)).toBeInTheDocument(); }); Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="./1757849504140(40)"></li><li class="carousel-slide" data-ssplayer-slide-index="41" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/42/1757849504533?e=1763596800&amp;v=beta&amp;t=JNt-5p7p7cfFzlGn1Q8fNGJ00fBdiahkMlNANWRDI2M" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Here, we mock the fetch function to return mock data, then test whether it appears in the component. 69. How do you test async behavior in React components? Testing async behavior often involves waiting for a component to update based on API calls or timeouts. Example: ●​ Use waitFor or findBy queries to wait for async changes.​ import { render, screen, waitFor } from &#39;@testing-library/react&#39;; import MyComponent from &#39;./MyComponent&#39;; test(&#39;loads data asynchronously&#39;, async () =&gt; { render(&lt;MyComponent /&gt;); // Wait for the element that should appear after the async call await waitFor(() =&gt; screen.getByText(&#39;Loaded Data&#39;)); expect(screen.getByText(&#39;Loaded Data&#39;)).toBeInTheDocument(); }); In this case, waitFor() waits until the expected element appears in the DOM after an async operation completes. 70. What is snapshot testing? Snapshot testing is a way of testing a component’s rendered output by saving it to a snapshot file and comparing it with future renders. This helps detect any unintended changes in the UI. Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/42/1757849504140?e=1763596800&amp;v=beta&amp;t=KdWCkNlCmN7HLCbgRHXsNuHD0cxqpi6IdpO61ka1UqU"></li><li class="carousel-slide" data-ssplayer-slide-index="42" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/43/1757849504533?e=1763596800&amp;v=beta&amp;t=6cT8nlvd0FW2liI_6b6Qk7LDas_E8mD32BCgx8qldN4" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al How to write snapshot tests: Run Jest with snapshot testing:​ ​ npm test -- --updateSnapshot 1.​ 2.​ Write a snapshot test using Jest:​ import { render } from &#39;@testing-library/react&#39;; import MyComponent from &#39;./MyComponent&#39;; test(&#39;matches snapshot&#39;, () =&gt; { const { asFragment } = render(&lt;MyComponent /&gt;); expect(asFragment()).toMatchSnapshot(); }); ●​ asFragment() captures the rendered output as a DOM snapshot.​ ●​ toMatchSnapshot() compares the output to a previously saved snapshot.​ The first time the test is run, it saves the output to a snapshot file. On subsequent runs, it compares the output to the saved snapshot. If there are any changes, the test will fail. Advanced React Concepts 71. What are Higher-Order Components (HOCs)? A Higher-Order Component (HOC) is a function that takes a component and returns a new component with additional props or behavior. ●​ Purpose: HOCs are used for code reuse, logic abstraction, and enhancing components with common functionality (e.g., authentication, data fetching, etc.).​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/43/1757849504140?e=1763596800&amp;v=beta&amp;t=7STT11VXCcQvSjzKRvai4JOPnPBJ9z_0QQmPNoF4OkA"></li><li class="carousel-slide" data-ssplayer-slide-index="43" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/44/1757849504533?e=1763596800&amp;v=beta&amp;t=QTwahmsY4ZvFElxhh7OfLzd8SFtiTbYHXLMKXcpe2sM" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ●​ How it works: HOCs are like decorators that wrap a component and add extra logic before rendering the component.​ Example: function withLoading(Component) { return function WithLoading(props) { if (props.isLoading) { return &lt;div&gt;Loading...&lt;/div&gt;; } return &lt;Component {...props} /&gt;; }; } const MyComponent = ({ data }) =&gt; &lt;div&gt;{data}&lt;/div&gt;; const MyComponentWithLoading = withLoading(MyComponent); In this example, withLoading is a higher-order component that adds loading state to MyComponent. 72. What is the render props pattern? The render props pattern is a technique for sharing code between components using a prop whose value is a function (a “render prop”). This function can return JSX or other values, allowing more dynamic behavior and custom rendering. ●​ Purpose: It enables a component to expose its logic while letting its consumers define how the output is rendered.​ Example: class MouseTracker extends React.Component { state = { x: 0, y: 0 }; handleMouseMove = (event) =&gt; { this.setState({ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/44/1757849504140?e=1763596800&amp;v=beta&amp;t=rF0QNLhV0GNzvxg5DVmD1Puxol0WkQYZxdDGM4NtWmQ"></li><li class="carousel-slide" data-ssplayer-slide-index="44" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/45/1757849504533?e=1763596800&amp;v=beta&amp;t=fHiXi-fRZiNAjR-wB6pSaRqu75FYET1vctkaKPMy178" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al x: event.clientX, y: event.clientY, }); }; render() { return ( &lt;div onMouseMove={this.handleMouseMove}&gt; {this.props.render(this.state)} &lt;/div&gt; ); } } const App = () =&gt; ( &lt;MouseTracker render={({ x, y }) =&gt; ( &lt;h1&gt;The mouse position is ({x}, {y})&lt;/h1&gt; )} /&gt; ); In this example, MouseTracker uses the render prop pattern to allow the parent component to decide how to render the mouse position data. 73. What are React Portals and when would you use them? A Portal provides a way to render children into a different part of the DOM outside of the parent component’s DOM hierarchy. This is particularly useful for scenarios like modals, tooltips, or popups that need to visually break out of their parent component but still maintain their React component state. ●​ When to use: When you need to render content outside the DOM hierarchy of a parent, without losing the React component context (e.g., for modals, overlays, etc.).​ Example: import React from &#39;react&#39;; Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/45/1757849504140?e=1763596800&amp;v=beta&amp;t=x-6l-HSZqz0hCjI0HhO0FaELY1VQSPLk9YxUczvkoPA"></li><li class="carousel-slide" data-ssplayer-slide-index="45" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/46/1757849504533?e=1763596800&amp;v=beta&amp;t=4WZGxISexdtSFtyWp3IGvycoOA2ybJqjAM4RaT5gzJU" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al import ReactDOM from &#39;react-dom&#39;; function Modal() { return ReactDOM.createPortal( &lt;div className=&quot;modal&quot;&gt;This is a modal&lt;/div&gt;, document.getElementById(&#39;modal-root&#39;) // Renders outside the normal DOM tree ); } export default Modal; In this case, the modal is rendered inside a specific part of the DOM (modal-root) even though it is a child of the Modal component. 74. What is reconciliation in React? Reconciliation is the process by which React updates the DOM efficiently when a component&#39;s state or props change. React uses a virtual DOM to compare the new virtual DOM tree with the previous one and determines the minimal set of changes required to update the actual DOM. Key Concepts: ●​ Virtual DOM: A lightweight representation of the real DOM.​ ●​ Diffing algorithm: React’s algorithm compares the old and new virtual DOMs to find the differences (diffs) and apply the smallest set of changes.​ Reconciliation Flow: 1.​ React creates a virtual DOM when the component is first rendered.​ 2.​ When state or props change, React creates a new virtual DOM.​ 3.​ The diffing algorithm compares the new virtual DOM with the old one.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/46/1757849504140?e=1763596800&amp;v=beta&amp;t=GqxY0Rp5sWVWzr7P48dt1NPTbqMLVTmDKg2EcOPRv2I"></li><li class="carousel-slide" data-ssplayer-slide-index="46" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/47/1757849504533?e=1763596800&amp;v=beta&amp;t=SuUDREeZjxpYBT0NQOLl503arvruEUpDRf2VkUusF8I" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 4.​ The necessary updates are batched and applied to the real DOM.​ 75. What is React Fiber? React Fiber is a complete rewrite of React&#39;s reconciliation algorithm. It is designed to improve the rendering performance and make React more responsive and capable of handling asynchronous rendering. Key Features: ●​ Incremental Rendering: React Fiber allows rendering to be split into chunks, so it can pause and resume work, improving responsiveness.​ ●​ Prioritization: React can assign different priority levels to updates (e.g., user input vs. background updates).​ ●​ Async Rendering: Enables non-blocking UI updates, making React apps feel more responsive.​ 76. How does an error boundary work in React? An Error Boundary is a React component that catches JavaScript errors in its child components, logs those errors, and displays a fallback UI. This prevents the entire app from crashing when an error occurs in a part of the component tree. Usage: 1.​ Implement componentDidCatch or static getDerivedStateFromError.​ 2.​ Use a fallback UI to handle errors gracefully.​ Example: class ErrorBoundary extends React.Component { constructor(props) { super(props); Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/47/1757849504140?e=1763596800&amp;v=beta&amp;t=ML5jhtUVeQZ16Q5-s0bEKKFNY8JLqVrRIDTRg9YPIto"></li><li class="carousel-slide" data-ssplayer-slide-index="47" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/48/1757849504533?e=1763596800&amp;v=beta&amp;t=Atd9BdvaxLKAkUiW_kqa_Cz0KlIqSEdfKhufYGmYKZo" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al this.state = { hasError: false }; } static getDerivedStateFromError(error) { return { hasError: true }; // Update state to trigger a fallback UI } componentDidCatch(error, info) { console.error(&quot;Error caught by Error Boundary:&quot;, error, info); } render() { if (this.state.hasError) { return &lt;h1&gt;Something went wrong!&lt;/h1&gt;; } return this.props.children; } } export default ErrorBoundary; You can wrap parts of your app in this ErrorBoundary to gracefully handle errors. 77. What are controlled side effects? Controlled side effects refer to operations in React that happen as a result of state or props changes but are carefully managed, typically using React Hooks like useEffect. ●​ Examples: Fetching data, subscribing to an event, manually updating the DOM, etc.​ ●​ Controlled: The side effect is triggered in response to specific state changes and cleaned up appropriately.​ Example of controlled side effect with useEffect: Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/48/1757849504140?e=1763596800&amp;v=beta&amp;t=S0GqkygPTdx862vdeksbX-XrhduQ1QEq5d4nRWxWgFE"></li><li class="carousel-slide" data-ssplayer-slide-index="48" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/49/1757849504533?e=1763596800&amp;v=beta&amp;t=a3Jp8MvwbcM5FjYmcw-LOsEZZWa6g_JMyXnRkJ0VvEs" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al import React, { useState, useEffect } from &#39;react&#39;; function MyComponent() { const [data, setData] = useState(null); useEffect(() =&gt; { const fetchData = async () =&gt; { const result = await fetch(&#39;/api/data&#39;); const json = await result.json(); setData(json); }; fetchData(); }, []); // Only runs once when the component is mounted return &lt;div&gt;{data ? JSON.stringify(data) : &#39;Loading...&#39;}&lt;/div&gt;; } Here, useEffect handles the side effect of fetching data when the component mounts, and the state is updated with the fetched data. 78. How do you implement server-side rendering (SSR) with React? Server-Side Rendering (SSR) allows React components to be rendered on the server and the resulting HTML to be sent to the client. This improves the initial loading performance and helps with SEO. SSR Process: 1.​ On the server, React renders the app to an HTML string using ReactDOMServer.renderToString().​ 2.​ This HTML is sent to the client, where React &quot;hydrates&quot; it, attaching event listeners and making it interactive.​ Example with express and React: Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/49/1757849504140?e=1763596800&amp;v=beta&amp;t=WasshVEGsHkSHmgAzrvNL2UEBhgAbqHHRx4vkCacoH0"></li><li class="carousel-slide" data-ssplayer-slide-index="49" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/50/1757849504533?e=1763596800&amp;v=beta&amp;t=bXsRhy80OYhoIdfjTcZa5P1wFWw8OSziEeHHt4pkY0A" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al const express = require(&#39;express&#39;); const React = require(&#39;react&#39;); const ReactDOMServer = require(&#39;react-dom/server&#39;); const App = require(&#39;./App&#39;); const server = express(); server.get(&#39;*&#39;, (req, res) =&gt; { const content = ReactDOMServer.renderToString(&lt;App /&gt;); res.send(` &lt;html&gt; &lt;head&gt;&lt;title&gt;SSR Example&lt;/title&gt;&lt;/head&gt; &lt;body&gt; &lt;div id=&quot;root&quot;&gt;${content}&lt;/div&gt; &lt;/body&gt; &lt;/html&gt; `); }); server.listen(3000, () =&gt; console.log(&#39;Server running on http://localhost:3000&#39;)); In this setup, React renders the app to HTML on the server, then the client &quot;hydrates&quot; it for interactivity. 79. What is static site generation (SSG) in React frameworks like Next.js? Static Site Generation (SSG) is a technique where HTML pages are generated at build time. Unlike SSR, SSG pre-renders all pages during the build process, which results in faster load times. Example with Next.js (SSG): import React from &#39;react&#39;; export async function getStaticProps() { Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/50/1757849504140?e=1763596800&amp;v=beta&amp;t=-IOnMJAcOuc-x2i9uWSAjMIp-43PbQR1W-CMsOSaPRM"></li><li class="carousel-slide" data-ssplayer-slide-index="50" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/51/1757849504533?e=1763596800&amp;v=beta&amp;t=tozTPy-I3WhMtVEl6djGctquj2KhNYYAj5n97VPQpjo" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al const data = await fetchDataFromAPI(); return { props: { data } }; } function Page({ data }) { return &lt;div&gt;{data}&lt;/div&gt;; } export default Page; Here, getStaticProps is a Next.js function that fetches data during build time. The page is pre-rendered and served as static HTML. 80. What is hydration in React SSR? Hydration refers to the process where React takes over the static HTML rendered by the server and attaches event listeners and restores interactivity. This happens once the JavaScript bundle is loaded on the client. ●​ SSR: Server renders the HTML.​ ●​ Hydration: React &quot;hydrates&quot; the server-rendered HTML to make it interactive.​ This process allows the page to load quickly (thanks to the server-rendered HTML) and then become fully interactive once React takes over. React Ecosystem &amp; Tools 81. What is Next.js and why use it? Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/51/1757849504140?e=1763596800&amp;v=beta&amp;t=6bTaRxoArfXjejN3zLRlZgW-uNcDghAzlVV0NuOdyzQ"></li><li class="carousel-slide" data-ssplayer-slide-index="51" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/52/1757849504533?e=1763596800&amp;v=beta&amp;t=ds5fzImFzeJrAlNk6O7ny7cgpKoLpDWW_tKvyzm9D28" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Next.js is a React framework that enables server-side rendering (SSR), static site generation (SSG), API routes, and more out-of-the-box. It simplifies React app development by providing a set of conventions and features that improve performance, SEO, and developer experience. Why use Next.js? ●​ Server-Side Rendering (SSR): Automatically generates HTML on the server for better SEO and faster initial load.​ ●​ Static Site Generation (SSG): Pre-renders pages at build time, improving performance.​ ●​ Automatic Code Splitting: Only loads the necessary JavaScript for the current page.​ ●​ File-Based Routing: Routing is based on the file system, making navigation easier.​ ●​ API Routes: Allows you to build API endpoints directly inside your Next.js app.​ ●​ Image Optimization: Automatically optimizes images for better performance.​ Example: npx create-next-app my-next-app In this setup, the app can be SSR or SSG-enabled, providing better performance and SEO out of the box. 82. What is Create React App? Create React App (CRA) is a boilerplate tool to set up a modern React app without configuring build tools like Webpack, Babel, etc. It’s designed to help you focus on writing code instead of spending time configuring tools. Features: ●​ Zero Configuration: It sets up Webpack, Babel, ESLint, and other essential tools.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/52/1757849504140?e=1763596800&amp;v=beta&amp;t=-pyiChoCZXxpOaMW14zLd7cAg2jutU0cy2x7dAHrpfQ"></li><li class="carousel-slide" data-ssplayer-slide-index="52" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/53/1757849504533?e=1763596800&amp;v=beta&amp;t=fK0owQNqVHpkiTn3NBvWaHMcKXe6cMtRBVU9MX17rWI" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ●​ Development Server: Provides a development server with hot reloading.​ ●​ Production Build: Automates production optimizations like minification, asset optimization, etc.​ How to Use CRA: npx create-react-app my-app cd my-app npm start With CRA, you don’t have to manually configure Webpack or Babel. It gives you everything you need to start building React applications right away. 83. What are common build tools used with React? Some common build tools for React are: 1.​ Webpack: A module bundler that compiles JavaScript, CSS, images, and other assets. It’s highly configurable and can be used for React apps, though tools like CRA automate this.​ 2.​ Babel: A JavaScript compiler that enables the use of modern JavaScript features (ES6+) and JSX syntax in React.​ 3.​ ESLint: A static code analysis tool that identifies problematic patterns in JavaScript, making sure your code follows a consistent style.​ 4.​ Prettier: A code formatter that enforces a consistent style across your codebase.​ 5.​ Parcel: A zero-config bundler that provides a fast alternative to Webpack.​ Many of these tools are integrated automatically when you use CRA or Next.js, but they can be configured or customized in more advanced setups. 84. How do you handle CSS in React applications? Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/53/1757849504140?e=1763596800&amp;v=beta&amp;t=W-5M9Z2dAmNkdaM8sHnTRDjmPJ2qiddYuda9kCRBLHE"></li><li class="carousel-slide" data-ssplayer-slide-index="53" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/54/1757849504533?e=1763596800&amp;v=beta&amp;t=g7O379H6GECNadFwiLct_tnKBXfgxiueEBGnv1GgVUg" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al There are several ways to handle CSS in React applications, and each comes with its own pros and cons. 1.​ Traditional CSS:​ ○​ You can import regular CSS files directly into your components.​ import &#39;./App.css&#39;; // Regular CSS file 2.​ ○​ Use className to apply styles.​ 3.​ CSS Modules:​ ○​ Scoped CSS that helps avoid name collisions.​ import styles from &#39;./App.module.css&#39;; function App() { return &lt;div className={styles.container}&gt;Hello, world!&lt;/div&gt;; } 4.​ 5.​ Styled-components (CSS-in-JS):​ ○​ CSS-in-JS allows writing actual CSS inside JavaScript files.​ ○​ Supports dynamic styling and theming.​ import styled from &#39;styled-components&#39;; const Button = styled.button` background: ${(props) =&gt; (props.primary ? &#39;blue&#39; : &#39;gray&#39;)}; color: white; `; function App() { return &lt;Button primary={true}&gt;Click Me&lt;/Button&gt;; Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/54/1757849504140?e=1763596800&amp;v=beta&amp;t=EinOWJ_bS6_6ncYReYnEHpnYFFL5wVWGpj6tG8F-Urs"></li><li class="carousel-slide" data-ssplayer-slide-index="54" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/55/1757849504533?e=1763596800&amp;v=beta&amp;t=Xcof3DHKeIJ37522leZw6VdurbYyVa9LBtPSC3rI3RY" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al } 6.​ 7.​ Emotion:​ ○​ Similar to styled-components, but with additional features like CSS prop for inline styling.​ /** @jsxImportSource @emotion/react */ import { css } from &#39;@emotion/react&#39;; const buttonStyle = css` background: blue; color: white; `; function App() { return &lt;button css={buttonStyle}&gt;Click Me&lt;/button&gt;; } 8.​ 9.​ Tailwind CSS:​ ○​ Utility-first CSS framework that uses predefined classes for layout and styling. Great for rapid development.​ 85. What are CSS-in-JS libraries? CSS-in-JS libraries allow you to write CSS styles directly inside JavaScript files, enabling better component encapsulation and dynamic styling. Popular libraries include: 1.​ Styled-components: Lets you create styled components that can be dynamically styled based on props or state.​ 2.​ Emotion: Similar to styled-components but with a focus on better performance and additional features.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/55/1757849504140?e=1763596800&amp;v=beta&amp;t=wjPj3UtcLmV-ON250QeBJwXiAQPeldkme6iaebE4Fks"></li><li class="carousel-slide" data-ssplayer-slide-index="55" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/56/1757849504533?e=1763596800&amp;v=beta&amp;t=uylym44lbkUynrVbgHyfkVWI0UHjEiL6lJjAYh6HLOM" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 3.​ JSS: A framework-agnostic CSS-in-JS solution that works well with React.​ These libraries help solve problems like global namespace conflicts and style collisions in large React applications, allowing for scoped, dynamic styles. 86. What is PropTypes in React? PropTypes is a runtime type-checking library used to validate the types of props passed to React components. It helps catch errors during development by ensuring that props match the expected data types. Example: import PropTypes from &#39;prop-types&#39;; function MyComponent({ name, age }) { return &lt;div&gt;{name} is {age} years old&lt;/div&gt;; } MyComponent.propTypes = { name: PropTypes.string.isRequired, age: PropTypes.number.isRequired, }; In this example, PropTypes.string.isRequired ensures that the name prop is a string and is required. If it’s not passed or is of the wrong type, React will display a warning in the console. 87. How do you do internationalization (i18n) in React? Internationalization (i18n) in React can be handled using libraries that help manage translations, time formats, and currency formatting. The most common libraries are: 1.​ react-i18next: A powerful i18n framework for React, which integrates with the i18next library to manage translation strings and locale settings.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/56/1757849504140?e=1763596800&amp;v=beta&amp;t=KM5VAqFb60lqYQL57oaFNWcvWRWcJYI7y_kxyF22FkY"></li><li class="carousel-slide" data-ssplayer-slide-index="56" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/57/1757849504533?e=1763596800&amp;v=beta&amp;t=iWrHknvjRK8I8ilsBD-cFgC0-Nq-JqDSsRWsPb0T6rE" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 2.​ FormatJS: A set of libraries that help with formatting numbers, dates, and translations.​ 3.​ react-intl: A React wrapper around the FormatJS library, used for localization and internationalization.​ Example with react-i18next: npm install react-i18next i18next import { useTranslation } from &#39;react-i18next&#39;; function MyComponent() { const { t } = useTranslation(); return &lt;h1&gt;{t(&#39;welcome_message&#39;)}&lt;/h1&gt;; } In this case, t(&#39;welcome_message&#39;) will fetch the corresponding translation for the current language set in your app. 88. How do you handle authentication in React apps? Authentication in React apps is typically done using tokens (JWTs) and local storage to persist user sessions. Common Steps: 1.​ Login: When the user logs in, send a request to the backend (e.g., with Axios or Fetch) to authenticate and get a token.​ 2.​ Store Token: Store the authentication token in localStorage or sessionStorage for persistence across sessions.​ 3.​ Private Routes: Use a higher-order component or React Router to protect routes that require authentication.​ 4.​ Logout: Remove the token from storage and redirect to the login page.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/57/1757849504140?e=1763596800&amp;v=beta&amp;t=LW1uHO-8Yq9JvptVT_MHwiWMyErm2cxWY-XbXcYZ3Iw"></li><li class="carousel-slide" data-ssplayer-slide-index="57" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/58/1757849504533?e=1763596800&amp;v=beta&amp;t=c6Jo--8ICsfDBfJm5BEcYnm_tFWWLeyr8FZqvw91-MM" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Example: function App() { const isAuthenticated = localStorage.getItem(&#39;authToken&#39;); return isAuthenticated ? &lt;Dashboard /&gt; : &lt;Login /&gt;; } For handling OAuth or third-party login (e.g., with Google or Facebook), you might use a library like Firebase or Auth0. 89. What is React Native and how does it differ from React? React Native is a framework for building native mobile applications (iOS and Android) using React and JavaScript. While React is for web development, React Native allows you to create mobile apps with a similar paradigm but using native components (e.g., &lt;View&gt; instead of &lt;div&gt;). Key Differences: ●​ React: Builds for the web, rendering HTML and managing DOM.​ ●​ React Native: Builds for mobile, using native components and APIs for interaction with mobile devices (camera, geolocation, etc.).​ Example in React Native: import { Text, View } from &#39;react-native&#39;; function App() { return ( &lt;View&gt; &lt;Text&gt;Hello, React Native!&lt;/Text&gt; &lt;/View&gt; ); } Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/58/1757849504140?e=1763596800&amp;v=beta&amp;t=yywZIyPJeeKN242RIv4w5C78mqFjFCbWHn-PMSfLRjw"></li><li class="carousel-slide" data-ssplayer-slide-index="58" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/59/1757849504533?e=1763596800&amp;v=beta&amp;t=lxHOX16UIExo4Yyl1of0EiKLJG1tXUJZgu24fSdcNmE" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al In React Native, the components map to native UI elements, such as &lt;Text&gt; for text, &lt;View&gt; for containers, and &lt;Button&gt; for buttons. 90. How do you manage forms in React with libraries like Formik or React Hook Form? Managing forms in React can be tedious, but libraries like Formik and React Hook Form simplify form handling by managing state, validation, and submission. Formik: ●​ Provides an easy way to manage form state, validation, and submission.​ ●​ Supports validation using schemas (e.g., Yup).​ Example with Formik: import { Formik, Field, Form } from &#39;formik&#39;; function MyForm() { return ( &lt;Formik initialValues={{ name: &#39;&#39;, email: &#39;&#39; }} onSubmit={(values) =&gt; console.log(values)} &gt; &lt;Form&gt; &lt;Field name=&quot;name&quot; /&gt; &lt;Field name=&quot;email&quot; /&gt; &lt;button type=&quot;submit&quot;&gt;Submit&lt;/button&gt; &lt;/Form&gt; &lt;/Formik&gt; ); } React Hook Form: Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/59/1757849504140?e=1763596800&amp;v=beta&amp;t=Syk0T5rpl9W5fTxUe-www6wmEL3lI95qWQvimAVdFZM"></li><li class="carou
