sel-slide" data-ssplayer-slide-index="59" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/60/1757849504533?e=1763596800&amp;v=beta&amp;t=N1rdDYCQpeH8D8Siie62Kb2H2Dv96tAqlZka9GR7L-Y" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ●​ A lightweight alternative to Formik that uses React hooks to handle form state.​ ●​ It’s more performance-oriented due to less re-rendering.​ Example with React Hook Form: import { useForm } from &#39;react-hook-form&#39;; function MyForm() { const { register, handleSubmit } = useForm(); const onSubmit = (data) =&gt; console.log(data); return ( &lt;form onSubmit={handleSubmit(onSubmit)}&gt; &lt;input {...register(&#39;name&#39;)} /&gt; &lt;input {...register(&#39;email&#39;)} /&gt; &lt;button type=&quot;submit&quot;&gt;Submit&lt;/button&gt; &lt;/form&gt; ); } Both libraries significantly reduce boilerplate and handle common issues like validation and form state management. Hooks Deep Dive 91. How do you handle side effects with hooks? Side effects are operations that occur outside of the React component’s scope, such as: ●​ Fetching data from an API​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/60/1757849504140?e=1763596800&amp;v=beta&amp;t=krkOWCwt3VLPojswJ2dWszLe8wmGAU0xBtS0R0TV5gA"></li><li class="carousel-slide" data-ssplayer-slide-index="60" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/61/1757849504533?e=1763596800&amp;v=beta&amp;t=j-hfvq2a2eGVHERAy5kApcMC36XoPBl2Iy3cjg-mZDg" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ●​ Setting up subscriptions​ ●​ Manually modifying the DOM​ In React, side effects are handled using the useEffect hook. Basic Example: import React, { useState, useEffect } from &#39;react&#39;; function Example() { const [count, setCount] = useState(0); useEffect(() =&gt; { document.title = `You clicked ${count} times`; }, [count]); // Only run when `count` changes return ( &lt;div&gt; &lt;p&gt;You clicked {count} times&lt;/p&gt; &lt;button onClick={() =&gt; setCount(count + 1)}&gt;Click me&lt;/button&gt; &lt;/div&gt; ); } useEffect allows you to perform side effects in function components. The second argument, the dependency array, specifies when to run the effect. If the array is empty, the effect runs only once after the initial render (like componentDidMount). 92. How do you avoid infinite loops with useEffect? Infinite loops in useEffect occur when the effect continually triggers itself because the dependency array includes values that change as a result of the effect itself. Common cause: Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/61/1757849504140?e=1763596800&amp;v=beta&amp;t=0l18GwyXU87m4HU3iIeiZFay8LMPhS-TiOd7Lfs0aVg"></li><li class="carousel-slide" data-ssplayer-slide-index="61" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/62/1757849504533?e=1763596800&amp;v=beta&amp;t=BapMkTAHh7-BTD_fpzL3jiSJttUAGJ5bAmWaUf5TXUc" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al If a value inside useEffect is being updated, and it&#39;s in the dependency array, React will keep rerunning the effect. How to avoid: ●​ Use an empty dependency array ([]) if the effect should run only once.​ ●​ Be selective with dependencies to avoid unnecessary re-renders.​ Example: useEffect(() =&gt; { // Perform API call or other side effects fetchData(); }, []); // No dependencies, effect runs only once If the dependency list has state values or props that change inside the effect, React will rerun it every time those values change. Be mindful of that! 93. How do you share logic between components with custom hooks? Custom hooks are a powerful way to share logic between components in a reusable and encapsulated way. A custom hook is simply a JavaScript function that uses React hooks (like useState, useEffect, etc.). Example of a custom hook: // useLocalStorage.js import { useState } from &#39;react&#39;; function useLocalStorage(key, initialValue) { const [storedValue, setStoredValue] = useState(() =&gt; { const item = localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; }); const setValue = (value) =&gt; { setStoredValue(value); Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/62/1757849504140?e=1763596800&amp;v=beta&amp;t=bII2ftA4XeQv2Kegv6wqU-azmRx1fTDs3RyJ1x_PPzQ"></li><li class="carousel-slide" data-ssplayer-slide-index="62" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/63/1757849504533?e=1763596800&amp;v=beta&amp;t=GKTErgAmUKFLEQsXz8Qpp4HOyTJEk6r2VTvJKsjwC8g" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al localStorage.setItem(key, JSON.stringify(value)); }; return [storedValue, setValue]; } export default useLocalStorage; You can then use this custom hook in any component: import useLocalStorage from &#39;./useLocalStorage&#39;; function App() { const [name, setName] = useLocalStorage(&#39;name&#39;, &#39;John&#39;); return ( &lt;div&gt; &lt;input value={name} onChange={(e) =&gt; setName(e.target.value)} placeholder=&quot;Enter your name&quot; /&gt; &lt;/div&gt; ); } Custom hooks allow for reusable logic (like managing form state, fetching data, etc.) and encapsulation of behavior in a way that doesn&#39;t require repeated code. 94. How do hooks affect component lifecycle? In class components, the lifecycle is managed using methods like componentDidMount, componentDidUpdate, and componentWillUnmount. With hooks, these are replaced with useEffect, which can mimic any lifecycle behavior. Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/63/1757849504140?e=1763596800&amp;v=beta&amp;t=jC70aaD9Mc6nAZgzvPs35nBKIri0oXloJu6j13wjGqk"></li><li class="carousel-slide" data-ssplayer-slide-index="63" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/64/1757849504533?e=1763596800&amp;v=beta&amp;t=0fXKo1kKNsCwkenrwhgOn91kvKEc_wrSeVCW2y9NDqA" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Lifecycle Mapping: ●​ componentDidMount: Use useEffect with an empty dependency array ([]).​ ●​ componentDidUpdate: Use useEffect with dependencies.​ ●​ componentWillUnmount: Return a cleanup function inside useEffect.​ Example: useEffect(() =&gt; { // Equivalent to componentDidMount and componentDidUpdate console.log(&quot;Component mounted or updated&quot;); return () =&gt; { // Equivalent to componentWillUnmount console.log(&quot;Cleanup before component unmount&quot;); }; }, [dependencies]); // Will run on mount and update based on dependencies 95. What are some common pitfalls when using hooks? 1.​ Incorrect dependencies in useEffect: Forgetting to include all necessary dependencies can lead to bugs or infinite loops.​ 2.​ Calling hooks conditionally: Hooks should always be called at the top level of the component. Never call hooks inside loops, conditions, or nested functions.​ 3.​ State updates with closures: If using state in a function inside useEffect, make sure to account for the most recent state.​ 4.​ Overusing useEffect: Using useEffect for trivial things (e.g., directly manipulating the DOM when it’s unnecessary) can lead to performance issues.​ 5.​ State updates in loops: Avoid unnecessary re-renders or state updates inside loops or effects that trigger multiple renders.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/64/1757849504140?e=1763596800&amp;v=beta&amp;t=aBZMa_9iDRi8SesXSPWvpp9ibkZQyy_yu_tW3KNstkQ"></li><li class="carousel-slide" data-ssplayer-slide-index="64" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/65/1757849504533?e=1763596800&amp;v=beta&amp;t=R4veCBCR_Cd8Dn8tt4uT_nrIsVGf_en50SkApIfIxJM" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ⚙️ Miscellaneous React Concepts 96. What are React keys and why are they important? React keys help React identify which items in a list are changed, added, or removed. Keys provide a stable identity for each element, allowing React to optimize re-renders. ●​ Important: Keys should be unique for each sibling component.​ ●​ Why important: Without keys, React has to re-render all list items when the list changes, which can be inefficient.​ Example: const items = [&#39;apple&#39;, &#39;banana&#39;, &#39;cherry&#39;]; return ( &lt;ul&gt; {items.map((item, index) =&gt; ( &lt;li key={index}&gt;{item}&lt;/li&gt; ))} &lt;/ul&gt; ); ●​ Tip: It’s better to use a unique identifier (e.g., id) as a key instead of using index if the list can change order or content dynamically.​ 97. How do you handle errors in React applications? Handling errors in React is done using Error Boundaries. They are React components that catch JavaScript errors anywhere in their child component tree and log those errors or display a fallback UI. Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/65/1757849504140?e=1763596800&amp;v=beta&amp;t=P-ous1OLpSGRmBm8xlhVfFOg2KtuFweOWXCSSiX3WHw"></li><li class="carousel-slide" data-ssplayer-slide-index="65" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/66/1757849504533?e=1763596800&amp;v=beta&amp;t=KbMsa9bbw28r6BV1VZyieyAmmjMcN5mg8ca2GFUfJO8" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al Example of Error Boundary: class ErrorBoundary extends React.Component { constructor(props) { super(props); this.state = { hasError: false }; } static getDerivedStateFromError(error) { return { hasError: true }; // Update state to trigger fallback UI } componentDidCatch(error, info) { console.error(error, info); } render() { if (this.state.hasError) { return &lt;h1&gt;Something went wrong!&lt;/h1&gt;; } return this.props.children; } } You wrap your components inside ErrorBoundary to catch and handle errors gracefully. 98. How do you optimize React application for SEO? To optimize React apps for SEO (Search Engine Optimization): 1.​ Server-Side Rendering (SSR): Use frameworks like Next.js to pre-render content on the server. This allows search engines to crawl the content.​ 2.​ Meta Tags: Use libraries like react-helmet to dynamically set meta tags (&lt;title&gt;, &lt;meta&gt; tags) for SEO.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/66/1757849504140?e=1763596800&amp;v=beta&amp;t=hQiVy4goM8R6gbtQLTIq34a88VwhXt6WWD98_UBr9rg"></li><li class="carousel-slide" data-ssplayer-slide-index="66" tabindex="-1" aria-hidden="true" style="width: 528px; height: 746px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/67/1757849504533?e=1763596800&amp;v=beta&amp;t=67U5vsM8nALfh52I1sy6XOZitTSQ3SR8HJNppgog1wY" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al 3.​ Structured Data: Use JSON-LD to provide structured data for search engines to understand the context of your content.​ 4.​ Dynamic Content: Preload important data to ensure that search engines can index key content.​ 5.​ Ensure Accessibility: Use semantic HTML to make content accessible to search engines.​ Example (with react-helmet): import { Helmet } from &#39;react-helmet&#39;; function MyPage() { return ( &lt;div&gt; &lt;Helmet&gt; &lt;title&gt;My SEO Optimized Page&lt;/title&gt; &lt;meta name=&quot;description&quot; content=&quot;Description of my page for SEO&quot; /&gt; &lt;/Helmet&gt; &lt;h1&gt;Welcome to My SEO Page&lt;/h1&gt; &lt;/div&gt; ); } 99. What is reconciliation and why is it important? Reconciliation is the process React uses to update the UI efficiently when state or props change. React compares the old virtual DOM with the new virtual DOM and calculates the minimal set of changes required to update the real DOM. This makes React apps fast and efficient. Why important: ●​ It helps React determine the minimal updates needed, avoiding unnecessary re-renders.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/67/1757849504140?e=1763596800&amp;v=beta&amp;t=SXNA248QX05aAD2qpgXlRPMO0KUtn9UN69ZPKC79Tb8"></li><li class="carousel-slide" data-ssplayer-slide-index="67" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/68/1757849504533?e=1763596800&amp;v=beta&amp;t=vFgXiXiPjeK8Pe1-wF0jJIDPAlrP-AE1wnWBt6iMxFA" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ●​ React uses a diffing algorithm to compare previous and current states to optimize DOM updates.​ 100. How does React handle updates to the DOM? React uses the Virtual DOM to handle updates. When state or props change, React creates a new virtual DOM, compares it to the previous version, and calculates the most efficient way to update the actual DOM. Steps: 1.​ State/Props Change: Trigger a re-render.​ 2.​ Create Virtual DOM: A new virtual DOM tree is created.​ 3.​ Diffing: React compares the old and new virtual DOM trees.​ 4.​ Reconcile: React updates only the necessary parts of the real DOM, improving performance.​ 101. What is the difference between React and Angular or Vue? React: ●​ Library for building UI, focusing on components and rendering.​ ●​ Declarative and flexible: Use JavaScript to write components.​ ●​ React has a rich ecosystem, but you often need additional libraries for routing, state management, etc.​ Angular: ●​ Framework: Full-fledged framework for building web apps.​ Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/68/1757849504140?e=1763596800&amp;v=beta&amp;t=op3ouFArcQJz3K-UUDWFN_lfCtsVBMK_Z2DzDn-YpkY"></li><li class="carousel-slide" data-ssplayer-slide-index="68" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/69/1757849504533?e=1763596800&amp;v=beta&amp;t=fNUTqe7u59BqrP1C9wd3__h_iBM4FvC9vTuCDlxwZhM" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al ●​ Uses TypeScript by default and has built-in solutions for routing, HTTP requests, form handling, and more.​ ●​ Two-way data binding: Automatically synchronizes model and view.​ Vue: ●​ Framework: Similar to React, but provides two-way binding and template syntax.​ ●​ Easier to integrate into existing projects.​ ●​ Flexibility: Offers the reactivity model and simplicity in syntax.​ 102. What is the role of JSX transpilation? JSX transpilation refers to the process of converting JSX syntax (JavaScript XML) into regular JavaScript. Since browsers don&#39;t understand JSX directly, tools like Babel transpile JSX into valid JavaScript that browsers can execute. Example: const element = &lt;h1&gt;Hello, world!&lt;/h1&gt;; Babel transpiles the JSX into: const element = React.createElement(&#39;h1&#39;, null, &#39;Hello, world!&#39;); 103. How do you implement drag and drop in React? You can use libraries like react-dnd or react-beautiful-dnd for drag-and-drop functionality. Example with react-beautiful-dnd: npm install react-beautiful-dnd import { DragDropContext, Droppable, Draggable } from &#39;react-beautiful-dnd&#39;; Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/69/1757849504140?e=1763596800&amp;v=beta&amp;t=s4aGzKGQW-Asntixkco72p5R_SmuwPeBs_KNlDR3bY8"></li><li class="carousel-slide" data-ssplayer-slide-index="69" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/70/1757849504533?e=1763596800&amp;v=beta&amp;t=2NMsRHC4knsugNl36lx13yZyzUD-WM1JTGcfDqj6mQo" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al function App() { const items = [&#39;item1&#39;, &#39;item2&#39;, &#39;item3&#39;]; return ( &lt;DragDropContext onDragEnd={() =&gt; {}}&gt; &lt;Droppable droppableId=&quot;droppable&quot;&gt; {(provided) =&gt; ( &lt;ul ref={provided.innerRef} {...provided.droppableProps}&gt; {items.map((item, index) =&gt; ( &lt;Draggable key={item} draggableId={item} index={index}&gt; {(provided) =&gt; ( &lt;li ref={provided.innerRef} {...provided.draggableProps} {...provided.dragHandleProps} &gt; {item} &lt;/li&gt; )} &lt;/Draggable&gt; ))} {provided.placeholder} &lt;/ul&gt; )} &lt;/Droppable&gt; &lt;/DragDropContext&gt; ); } 104. What is concurrent mode in React? Concurrent Mode is an experimental feature in React that enables the rendering process to be interruptible. It allows React to work on multiple tasks at once, making apps feel more Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/70/1757849504140?e=1763596800&amp;v=beta&amp;t=CcVARnwRLXVCOwhNnmf7_ZvqmQ94Y4kUvjiH433IleY"></li><li class="carousel-slide" data-ssplayer-slide-index="70" style="width: 528px; height: 746px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_800/B56ZlH_rX6HUAc-/71/1757849504533?e=1763596800&amp;v=beta&amp;t=xzYQvDHVEgUl1HPtax8S7c7ekiAcjOCSqQWhKVYNpGI" alt="htt ps ://w ww .lin ke din .co m/ in/ sa nd ee pp al responsive by prioritizing higher-priority updates (like animations or user input) over lower-priority ones. 105. How do Suspense and React.lazy work? React.lazy enables you to dynamically import components only when they are needed, enabling code splitting and lazy loading. const LazyComponent = React.lazy(() =&gt; import(&#39;./LazyComponent&#39;)); function App() { return ( &lt;React.Suspense fallback={&lt;div&gt;Loading...&lt;/div&gt;}&gt; &lt;LazyComponent /&gt; &lt;/React.Suspense&gt; ); } Suspense is a wrapper around lazy-loaded components that shows a loading fallback while the component is being loaded. Follow On LinkedIn: Sandeep Pal https://www.linkedin.com/in/sandeeppal" src="https://media.licdn.com/dms/image/v2/D561FAQEC58bG9Ul8cg/feedshare-document-images_1280/B56ZlH_rX6HUAs-/71/1757849504140?e=1763596800&amp;v=beta&amp;t=8mT9sJyyiHed8S6VeCGGeSmW4wIcGiyaI4n6_niYhGs"></li></ul></div>
